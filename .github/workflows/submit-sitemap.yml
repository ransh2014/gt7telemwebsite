name: Submit sitemap

# Submits sitemap.xml to Google Search Console without deploying anything. Run it by hand from the Actions
# tab ("Run workflow") to test the GSC_SERVICE_ACCOUNT_JSON secret; the Deploy site workflow does the same
# thing automatically after each deploy.
on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit the sitemap to Google Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::The GSC_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          python -m pip install -q google-auth requests
          python .github/scripts/submit_sitemap.py
