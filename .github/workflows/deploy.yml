name: Deploy site

# Deploys the site to Netlify by itself once a new TRACE release has all of its
# downloads attached (so the site's download buttons never point at a missing file).
# Also runnable by hand from the Actions tab ("Run workflow", tick force to redeploy).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if this release was already deployed"
        type: boolean
        default: false
      ignore_credit_guard:
        description: "Deploy even if NETLIFY_CREDITS_LEFT is below 45"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Is there a complete new release?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ransh2014/gt7telemtrace/releases/latest)
          tag=$(echo "$json" | jq -r .tag_name)
          names=$(echo "$json" | jq -r '[.assets[].name] | join(" ")')
          last=$(cat .deployed-tag 2>/dev/null || echo none)
          complete=true
          for f in gt7telem-windows.zip gt7telem-macos.zip gt7telem-linux.zip gt7telem-source.zip gt7telem-android.apk; do
            case " $names " in *" $f "*) ;; *) complete=false; echo "waiting for $f on $tag";; esac
          done
          deploy=false
          if [ "$FORCE" = "true" ]; then deploy=true; fi
          if [ "$complete" = "true" ] && [ "$tag" != "$last" ]; then deploy=true; fi
          echo "latest=$tag deployed=$last complete=$complete -> deploy=$deploy"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Netlify credit countdown
        id: credits
        if: steps.rel.outputs.deploy == 'true'
        env:
          # The balance lives in .credits-left (counts down by 15 after every deploy) and
          # resets to the monthly allowance on the 22nd, when Netlify's credits reset.
          # Edit .credits-left by hand to correct it. NETLIFY_CREDITS_MONTHLY (repo
          # variable) overrides the 300 default; NETLIFY_CREDITS_LEFT is only the
          # fallback if .credits-left is missing.
          MONTHLY: ${{ vars.NETLIFY_CREDITS_MONTHLY || '300' }}
          FALLBACK: ${{ vars.NETLIFY_CREDITS_LEFT }}
          IGNORE: ${{ inputs.ignore_credit_guard }}
        run: |
          day=$(date -u +%-d); y=$(date -u +%Y); m=$(date -u +%m)
          if [ "$day" -ge 22 ]; then period="$y-$m"; else period=$(date -u -d "$y-$m-01 -1 month" +%Y-%m); fi
          stored=$(cat .credits-period 2>/dev/null || echo none)
          left=$(cat .credits-left 2>/dev/null || echo "$FALLBACK")
          if [ "$stored" != "$period" ]; then
            echo "New Netlify credit period ($period): resetting to $MONTHLY"
            left=$MONTHLY
          fi
          echo "$period" > .credits-period
          echo "$left" > .credits-left
          echo "Netlify credits left before this deploy: $left"
          ok=true
          if [ "$IGNORE" != "true" ] && [ -n "$left" ] && [ "$left" -lt 45 ] 2>/dev/null; then
            ok=false
            echo "::warning::Skipping the deploy: $left credits left (below 45). Top up or fix .credits-left, then run this workflow again."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Build the publish folder
        if: steps.rel.outputs.deploy == 'true' && steps.credits.outputs.ok == 'true'
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.netlify' --exclude '.claude' \
            --exclude '_site' --exclude '.gitignore' --exclude '.netlifyignore' \
            --exclude '.deployed-tag' --exclude '.credits-left' --exclude '.credits-period' ./ _site/

      - uses: actions/setup-node@v5
        if: steps.rel.outputs.deploy == 'true' && steps.credits.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Deploy to Netlify
        if: steps.rel.outputs.deploy == 'true' && steps.credits.outputs.ok == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir=_site --message "TRACE ${{ steps.rel.outputs.tag }}"

      - name: Remember what was deployed
        if: steps.rel.outputs.deploy == 'true' && steps.credits.outputs.ok == 'true'
        run: |
          echo "${{ steps.rel.outputs.tag }}" > .deployed-tag
          left=$(cat .credits-left); echo $((left - 15)) > .credits-left     # a production deploy costs 15
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .deployed-tag .credits-left .credits-period
          git commit -m "deployed ${{ steps.rel.outputs.tag }}" || true
          git push